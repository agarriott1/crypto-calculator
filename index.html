<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonBag Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div id="stars" class="fixed inset-0 overflow-hidden pointer-events-none"></div>
    
    <div class="main-grid">
        <!-- Left Column: Crypto Selection -->
        <section class="crypto-section">
            <h2 class="text-2xl font-bold mb-4">
                <span class="text-cyan-400 mr-2">|</span>Selected Crypto
            </h2>
            
            <!-- Crypto Search -->
            <div class="relative">
                <input type="text" id="cryptoSearch" placeholder="Search cryptocurrency..." 
                    class="w-full bg-gray-800/50 border border-white/10 rounded-lg px-4 py-3 mb-4">
                <div id="cryptoDropdown" class="hidden absolute w-full bg-gray-800/95 border border-white/10 rounded-lg mt-1 max-h-96 overflow-y-auto z-50">
                    <!-- Dropdown options will be populated here -->
                </div>
            </div>
            
            <!-- Crypto Card Display -->
            <div id="cryptoCard" class="crypto-card-display">
                <!-- Card content will be populated here -->
            </div>
        </section>

        <!-- Right Column Top: Strategy Selection -->
        <section class="strategy-section">
            <h2 class="text-2xl font-bold mb-4">
                <span class="text-cyan-400 mr-2">|</span>Choose Strategy
            </h2>
            <div class="strategy-grid">
                <!-- Strategy cards will be populated here -->
            </div>
            <div id="strategyInputs" class="hidden space-y-4 mt-4">
                <!-- Strategy inputs will be populated here -->
            </div>
        </section>

        <!-- Right Column Bottom: Results -->
        <section id="resultsSection" class="results-section hidden">
            <h2 class="text-2xl font-bold mb-4">
                <span class="text-cyan-400 mr-2">|</span>Results
            </h2>
            <div id="resultsContent" class="space-y-4">
                <!-- Results will be populated here -->
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
